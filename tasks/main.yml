---
- name: Check if node exporter binary exists
  ansible.builtin.stat:
    path: "{{ prometheus_exporters_common_dist_dir }}/{{ prometheus_node_exporter_release_name }}/node_exporter"
  register: prometheus_node_exporter_binary

- name: Check installed node exporter version
  ansible.builtin.command:
    cmd: "{{ prometheus_exporters_common_dist_dir }}/{{ prometheus_node_exporter_release_name }}/node_exporter --version"
  register: prometheus_node_exporter_current_version
  changed_when: false
  failed_when: false
  when:
    - prometheus_node_exporter_binary.stat.exists
    - prometheus_node_exporter_binary.stat.executable

- name: Download prometheus node exporter binary
  ansible.builtin.get_url:
    url: "{{ url }}"
    dest: "/tmp/{{ prometheus_node_exporter_release_name }}.tar.gz"
    mode: '0644'
  when: prometheus_node_exporter_needs_install

- name: Unarchive binary tarball
  ansible.builtin.unarchive:
    src: "/tmp/{{ prometheus_node_exporter_release_name }}.tar.gz"
    dest: "{{ prometheus_exporters_common_dist_dir }}"
    remote_src: true
    creates: "{{ prometheus_exporters_common_dist_dir }}/{{ prometheus_node_exporter_release_name }}/node_exporter"
    owner: "{{ prometheus_exporters_common_user }}"
    group: "{{ prometheus_exporters_common_group }}"
  register: prometheus_node_exporter_updated
  notify:
    - restart node exporter
  when: prometheus_node_exporter_needs_install

- name: Clean up downloaded tarball
  ansible.builtin.file:
    path: "/tmp/{{ prometheus_node_exporter_release_name }}.tar.gz"
    state: absent
  when: prometheus_node_exporter_needs_install

- name: update group and owner for files
  file:
    path: "{{ prometheus_exporters_common_dist_dir }}/{{ prometheus_node_exporter_release_name }}"
    state: directory
    recurse: yes
    owner: "{{ prometheus_exporters_common_user}}"
    group: "{{ prometheus_exporters_common_group }}"
  when: prometheus_node_exporter_updated is changed

- name: create symlink to the current release
  file:
    src: "{{ prometheus_exporters_common_dist_dir }}/{{ prometheus_node_exporter_release_name }}"
    path: "{{ prometheus_exporters_common_root_dir }}/node_exporter_current"
    state: link

- name: include web.config logic
  include_tasks: web_config.yml
  when: prometheus_node_exporter_basic_auth_enable or prometheus_node_exporter_tls_enable

  # when: prometheus_node_exporter_tls_cert is defined or
  #   prometheus_node_exporter_tls_key is defined or
  #   prometheus_node_exporter_tls_selfsigned or
  #   prometheus_node_exporter_tls_ownca or
  #   prometheus_node_exporter_tls_client_ca is defined or
  #   prometheus_node_exporter_basic_auth_users is defined or
  #   prometheus_node_exporter_http_server_config is defined


- name: create systemd service unit
  template:
    src: etc/systemd/system/prometheus-node-exporter.service.j2
    dest: /etc/systemd/system/prometheus-node-exporter.service
    owner: root
    group: root
    mode: 0644
  when: service_mgr | default(ansible_service_mgr) == 'systemd'
  notify:
    - reenable node exporter service
    - restart node exporter

- name: Looking which version of upstart is install
  command: initctl version
  when: service_mgr | default(ansible_service_mgr) == 'upstart'
  register: upstart_version
  changed_when: false

- name: create init service unit
  template:
    src: etc/init/prometheus-node-exporter.conf.j2
    dest: /etc/init/prometheus-node-exporter.conf
    owner: root
    group: root
    mode: 0644
  when: service_mgr | default(ansible_service_mgr) == 'upstart'
  notify:
    - reinit node exporter
    - restart node exporter

- name: create sysvinit service unit
  template:
    src: etc/init.d/prometheus-node-exporter.j2
    dest: /etc/init.d/prometheus-node-exporter
    owner: root
    group: root
    mode: 0755
  when: service_mgr | default(ansible_service_mgr) in [ 'sysvinit', 'service' ]
  notify:
    - restart node exporter

- meta: flush_handlers

- name: ensure prometheus node exporter service is enabled and started
  service:
    name: prometheus-node-exporter
    state: restarted
    enabled: yes
