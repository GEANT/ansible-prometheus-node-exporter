---
- name: Check installed node exporter version
  ansible.builtin.command:
    cmd: "{{ prometheus_exporters_common_dist_dir }}/{{ prometheus_node_exporter_release_name }}/node_exporter --version"
  register: _pinev
  changed_when: false
  failed_when: false

- name: Set installed version
  ansible.builtin.set_fact:
    prometheus_node_exporter_installed_version: "{{ _pinev.stdout | regex_replace('(?sm).*version\\s+(\\S+)\\s+.*', '\\1') }}"

- name: Download and install from {{ url }}
  ansible.builtin.unarchive:
    src: "{{ url }}"
    dest: "{{ prometheus_exporters_common_dist_dir }}"
    remote_src: true
    creates: "{{ prometheus_exporters_common_dist_dir }}/{{ prometheus_node_exporter_release_name }}/node_exporter"
    owner: "{{ prometheus_exporters_common_user }}"
    group: "{{ prometheus_exporters_common_group }}"
  register: prometheus_node_exporter_updated
  when: prometheus_node_exporter_version != prometheus_node_exporter_installed_version

- name: Ensure symlink to the current release is available
  ansible.builtin.file:
    src: "{{ prometheus_exporters_common_dist_dir }}/{{ prometheus_node_exporter_release_name }}"
    path: "{{ prometheus_exporters_common_root_dir }}/node_exporter_current"
    state: link

- name: Include web.config logic
  ansible.builtin.include_tasks: web_config.yml
  when: prometheus_node_exporter_basic_auth_enable or prometheus_node_exporter_tls_enable
  # when: prometheus_node_exporter_tls_cert is defined or
  #   prometheus_node_exporter_tls_key is defined or
  #   prometheus_node_exporter_tls_selfsigned or
  #   prometheus_node_exporter_tls_ownca or
  #   prometheus_node_exporter_tls_client_ca is defined or
  #   prometheus_node_exporter_basic_auth_users is defined or
  #   prometheus_node_exporter_http_server_config is defined

- name: Ensure systemd service unit is available
  ansible.builtin.template:
    src: etc/systemd/system/prometheus-node-exporter.service.j2
    dest: /etc/systemd/system/prometheus-node-exporter.service
    owner: root
    group: root
    mode: "0644"
  notify: systemd_daemon_reload

- name: Ensure systemd reloads immediately after changes
  ansible.builtin.meta: flush_handlers

- name: Ensure prometheus node exporter service is enabled and started
  ansible.builtin.service:
    name: prometheus-node-exporter
    state: restarted
    enabled: true
